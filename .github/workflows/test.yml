name: build
on:
  push:
    branches: [ master ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Supported Node.js release lines (see "engines" in package.json).
        node-version: [22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4 # version is read from "packageManager" in package.json
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm test
    - run: pnpm docs:check
    - run: pnpm check:package
    - run: pnpm smoke
